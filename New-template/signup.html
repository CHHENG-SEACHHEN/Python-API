<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="{{ url_for('static', path='css/output.css') }}"
      rel="stylesheet"
    />
    <link href="/static/css/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      crossorigin="anonymous"
    />
  </head>
  <body class="min-h-screen flex flex-col">
    <header class="w-full p-4">
      <i class="fa-solid fa-arrow-left-long text-pink-600 mr-4"></i>
      <a
        href="/"
        class="inline-flex items-center text-pink-600 font-bold text-lg hover:underline"
      >
        Back to Home
      </a>
    </header>
    <!-- Create account container -->
    <main class="flex-1 flex items-center justify-center p-4">
      <div
        class="border-2 border-pink-400 rounded-lg w-100 bg-pink-100 shadow-pink-300 shadow-lg"
      >
        <div class="p-4">
          <div class="font-bold text-pink-600 text-xl text-center my-4">
            Create an Account ౨ৎ ⋆｡˚
          </div>
          <!-- Username -->
          <div>
            <div class="font-semibold text-pink-600">
              <i class="fa-solid fa-user mr-1"></i>Username ⊹ ࣪ ˖ ໒꒱
            </div>
            <input
              id="userName"
              type="text"
              class="w-full border border-pink-200 rounded-lg px-2 py-1 mt-2 mb-2 focus:bg-white"
              placeholder="Username"
            />
          </div>
          <!-- Email -->
          <div>
            <div class="font-semibold text-pink-600">
              <i class="fa-solid fa-envelope mr-1"></i>Email ⊹ ࣪ ˖ ໒꒱
            </div>
            <input
              id="email"
              type="email"
              class="w-full border border-pink-200 rounded-lg px-2 py-1 mt-2 mb-2 focus:bg-white"
              placeholder="Email Address"
            />
          </div>
          <!-- Password  -->
          <div>
            <div class="font-semibold text-pink-600">
              <i class="fa-solid fa-key mr-1"></i>Password ⊹ ࣪ ˖ ໒꒱
            </div>
            <input
              id="userPassword"
              type="password"
              class="w-full border border-pink-200 rounded-lg px-2 py-1 mt-2 mb-2 focus:bg-white"
              placeholder="Password"
            />
          </div>
          <!-- Confirm Password -->
          <div>
            <div class="font-semibold text-pink-600">
              <i class="fa-solid fa-lock mr-1"></i>Confirm ⊹ ࣪ ˖ ໒꒱
            </div>
            <input
              id="confirmPassword"
              type="password"
              class="w-full border border-pink-200 rounded-lg px-2 py-1 mt-2 mb-2 focus:bg-white"
              placeholder="Confirm Password"
            />
          </div>
          <br /><br /><br />
          <!-- T&C -->
          <div>
            <div class="flex">
              <input
                id="termAgreement"
                type="checkbox"
                class="flex items-center"
              />
              <span class="text-sm text-pink-500 font-bold pl-1"
                >I agree to the
                <a href="#" class="text-pink-700 hover:underline"
                  >Terms and conditions.</a
                >
                ✮ ₊˚
              </span>
            </div>
          </div>
          <!-- Sign up -->
          <div class="mt-2 mb-4">
            <button
              id="signUP"
              class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-lg font-bold w-full"
            >
              Sign In
            </button>
          </div>
          <div class="p-2 text-sm text-center">
            <a href="/login" class="text-pink-400 hover:underline"
              >Already have an account? Sign In</a
            >
          </div>
        </div>
      </div>
    </main>

    <script>
      document
        .getElementById("signUP")
        .addEventListener("click", async function () {
          const username = document.getElementById("userName").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("userPassword").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;
          const isAgreed = document.getElementById("termAgreement").checked;

          // Frontend validation checks
          if (!username || !email || !password || !confirmPassword) {
            alert("All fields are required!");
            return;
          }

          if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
          }

          if (!isAgreed) {
            alert("You must agree to the terms.");
            return;
          }

          try {
            const response = await fetch("/signup", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                username: username,
                email: email,
                password: password,
                agreed: isAgreed,
              }),
            });

            const data = await response.json();
            alert(data.message);

            if (response.ok && data.redirect) {
              window.location.href = data.redirect;
            }
          } catch (error) {
            console.error("Error:", error);
            alert("Something went wrong. Please try again.");
          }
        });
    </script>
  </body>
</html>
